version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Agentic PMBOK Toolkit — Docker Compose
#
# Services:
#   api   → FastAPI server on :8000  (serves live artifact JSON to dashboard)
#   n8n   → n8n workflow engine on :5678
#
# Start all:  docker compose up -d
# API only:   docker compose up -d api
# Logs:       docker compose logs -f api
# Stop:       docker compose down
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI artifact server ─────────────────────────────────────────────────
  api:
    image: python:3.12-slim
    container_name: pmbok-api
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - .:/app                      # full project mounted
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KANBAN_PROVIDER=${KANBAN_PROVIDER:-trello}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - TRELLO_BOARD_ID=${TRELLO_BOARD_ID}
      - TRELLO_LIST_ID=${TRELLO_LIST_ID}
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY}
      - CURRENT_SPRINT=${CURRENT_SPRINT:-SP-03}
      - SPRINT_START_DATE=${SPRINT_START_DATE}
      - SPRINT_END_DATE=${SPRINT_END_DATE}
    command: >
      sh -c "pip install fastapi uvicorn requests python-dotenv jsonschema PyGithub anthropic openai --quiet &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── n8n workflow engine ─────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: pmbok-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=last
      - EXECUTIONS_DATA_MAX_AGE=72
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - KANBAN_PROVIDER=${KANBAN_PROVIDER:-trello}
      - CURRENT_SPRINT=${CURRENT_SPRINT:-SP-03}
      - SPRINT_START_DATE=${SPRINT_START_DATE}
      - SPRINT_END_DATE=${SPRINT_END_DATE}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - TRELLO_BOARD_ID=${TRELLO_BOARD_ID}
      - TRELLO_LIST_ID=${TRELLO_LIST_ID}
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src:/home/node/src:ro
      - ./schemas:/home/node/schemas:ro
      - ./prompts:/home/node/prompts:ro
      - ./artifacts:/home/node/artifacts:rw
      - ./logs:/home/node/logs:rw
    entrypoint: >
      sh -c "apt-get update -qq &&
             apt-get install -y -qq python3 python3-pip &&
             pip3 install --break-system-packages requests python-dotenv jsonschema PyGithub anthropic openai --quiet &&
             n8n start"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  n8n_data:
    driver: local
